# Weekly update PRs for Gradle dependencies and GitHub Actions (including the Node 24 action
# majors). Dependabot reads the default branch, so this takes effect once merged there.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-tooling:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "com.android.tools.build*", "com.google.dagger*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
