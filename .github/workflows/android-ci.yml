name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against official checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Domain unit tests (pure Kotlin)
        run: ./gradlew --no-daemon :core:domain:test

      - name: App unit tests, lint, debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Test summary
        run: python3 .github/scripts/test_summary.py

      - name: Room schema drift
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "Room schema differs from the committed copy:"
            git status --porcelain -- app/schemas
            find app/schemas -name '*.json' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \;
            exit 0  # TODO(W2): switch to exit 1 once v1 schema is committed
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/domain/build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
