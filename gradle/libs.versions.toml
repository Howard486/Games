[versions]
# Pinned at kickoff (SA §8.2). Bump via PR with CI green; never use dynamic versions.
agp = "8.13.0"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
hilt = "2.57.2"
composeBom = "2025.08.00"
coreKtx = "1.16.0"
lifecycle = "2.9.1"
activityCompose = "1.10.1"
navigation = "2.9.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
room = "2.7.2"
datastore = "1.1.7"
robolectric = "4.16.1"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
hiltNavigationCompose = "1.2.0"
work = "2.10.0"
junit4 = "4.13.2"
junitJupiter = "6.1.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
